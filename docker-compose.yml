services:
  database:
    image: postgres:16-alpine
    container_name: amusement_park_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: amusement_park
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - amusement_park_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d amusement_park
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amusement_park_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/amusement_park
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: change-this-to-a-long-production-secret-key
      JWT_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  amusement_park_postgres_data: